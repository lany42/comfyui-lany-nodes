name: Mirror canonical repository

# Enable MIRROR_ENABLED only after origin contains every intended commit and tag.
# REPO_MIRROR is a fine-grained PAT with Contents/Workflows write access to this mirror.
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: canonical-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ github.repository == 'lany42/comfyui-lany-nodes' && vars.MIRROR_ENABLED == 'true' }}
    permissions:
      actions: write # only for dispatch-workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mirror canonical repository
        uses: lany42/lany-actions-ci/actions/mirror@bb944f52f0849af08e8a6b12ae4d40825301ee94 # v1.0.0
        with:
          canonical-url: https://git.colorized.life/comfyui-lany-nodes.git
          token: ${{ secrets.REPO_MIRROR }}
          dispatch-workflow: publish.yml
