name: Publish to Comfy registry

# Mirrored tag pushes use REPO_MIRROR and can trigger this workflow.
# Leave REGISTRY_PUBLISH_ENABLED unset/false until ready to publish.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-node:
    name: Publish Custom Node to registry
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.created && !github.event.deleted && !github.event.forced)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish Custom Node
        if: >-
          vars.REGISTRY_PUBLISH_ENABLED == 'true' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: Comfy-Org/publish-node-action@main
        with:
          skip_checkout: 'true'
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
