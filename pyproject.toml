[project]
name = "comfyui-lany-nodes"
version = "2.0.0"
description = "Utility, common, and experimental nodes for ComfyUI."
readme = "README.md"
authors = [
    { name = "Lany Atwood", email = "lany@colorized.life" }
]
requires-python = ">=3.13"
# ComfyUI supplies comfy_api and runtime PyTorch.
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT"]
# Mirror these direct runtime dependencies in requirements.txt by hand.
dependencies = ["numpy>=1.25.0", "Pillow"]

[project.urls]
Repository = "https://github.com/lany42/comfyui-lany-nodes"
Homepage = "https://git.colorized.life/comfyui-lany-nodes/"

[tool.comfy]
PublisherId = "lany-atwood"
DisplayName = "ComfyUI Lany Nodes"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16.6",
    "torch>=2.6",
]

[tool.uv]
python-preference = "system"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
source-include = [
    "__init__.py",
    "requirements.txt",
    ".python-version",
    "AGENTS.md",
    "uv.lock",
    "tests/**",
    "package.json",
    "package-lock.json",
    ".prettierrc.json",
    ".prettierignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib", "--confcutdir=tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"./__init__.py" = ["N999"]
